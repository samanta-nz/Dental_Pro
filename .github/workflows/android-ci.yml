name: Android checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Check Edge function authorization
        run: node supabase/functions/tests/auth-and-deletion.test.mjs
      - name: Test, lint and build debug APK
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
      - name: Upload reports and test APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-checks-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
          retention-days: 14

