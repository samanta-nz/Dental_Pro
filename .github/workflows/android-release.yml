name: Signed Android release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - gradle.properties
      - .github/workflows/android-release.yml
  workflow_dispatch:
    inputs:
      publish_supabase:
        description: 'Also announce this release to the in-app updater'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: signed-android-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require signing secrets
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_PROPERTIES" ]; then
            echo '::error::Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PROPERTIES. See docs/GITHUB_RELEASE_FA.md.'
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Restore signing configuration
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: python3 scripts/restore-ci-signing.py
      - name: Test and build signed APK
        run: |
          node supabase/functions/tests/auth-and-deletion.test.mjs
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleRelease -PRELEASE_APPROVED=true '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
      - name: Verify APK and prepare release
        id: apk
        run: python3 scripts/prepare-release-artifact.py
      - name: Retain signed artifact and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release-${{ github.sha }}
          path: |
            dist/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
          RELEASE_NAME: ${{ steps.apk.outputs.version }}
          RELEASE_NOTES: ${{ steps.apk.outputs.notes }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt dist/verification.json --target "$GITHUB_SHA" --title "DentalPro $RELEASE_NAME" --notes-file "$RELEASE_NOTES"
      - name: Publish to in-app updater
        if: inputs.publish_supabase == true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_NAME: ${{ steps.apk.outputs.version }}
          RELEASE_CODE: ${{ steps.apk.outputs.code }}
          RELEASE_NOTES: ${{ steps.apk.outputs.notes }}
        run: python3 scripts/publish-release.py "dist/DentalPro-${RELEASE_NAME}-release.apk" --code "$RELEASE_CODE" --name "$RELEASE_NAME" --notes "$RELEASE_NOTES"
      - name: Remove signing material
        if: always()
        run: |
          rm -f keystore.properties
          rm -rf "$RUNNER_TEMP/dentalpro-signing"
